# Tmux configuration file
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.tmux/plugins/tpm/tpm'

# Set prefix key to Ctrl-a instead of default Ctrl-b
unbind C-b
set -g prefix C-l
bind C-l send-prefix


bind R command-prompt -I "#{session_name}" "rename-session '%%'"


# Resize panes (still no prefix)
bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
bind -n M-l resize-pane -R 5


bind -n C-h if-shell "tmux display -p '#{pane_current_command}' | grep -iq nvim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "tmux display -p '#{pane_current_command}' | grep -iq nvim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "tmux display -p '#{pane_current_command}' | grep -iq nvim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "tmux display -p '#{pane_current_command}' | grep -iq nvim" "send-keys C-l" "select-pane -R"


# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on


# Alt + number to switch windows
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9


# renaming windows with prefix + ,
bind , command-prompt -I "#W" "rename-window '%%'"
# renaming windows with prefix + ,
bind $ command-prompt -I "#S" "rename-session '%%'"


# no automatic renaming of windows
set -g automatic-rename off
set -g allow-rename off

# copy mode config
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle


# open new window in current path
unbind c
bind c new-window -c "#{pane_current_path}"

# no confirmation kill page
unbind x
bind x kill-pane


bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'wl-copy'



bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"






set -g status on
set -g status-interval 1
set -g status-justify centre

# Base
set -g status-style "bg=#1a2026,fg=#b0b0b0"

##### LEFT SIDE (Session Identity) #####

set -g status-left-length 40
set -g status-left-style "bg=#1a2026,fg=#7797b7"

set -g status-left "#[bg=#1e242a,fg=#2d3339]||#[bg=#242a30,fg=#7797b7,bold] 󰗆 #S #[bg=#1e242a,fg=#2d3339] ||"

##### RIGHT SIDE (Context, minimal) #####

set -g status-right-length 40
set -g status-right-style "bg=#1e242a,fg=#565c62"

set -g status-right "#[bg=#1e242a,fg=#2d3339] || #[bg=#242a30,fg=#e89199]  Xonoxc 󰗆  #[bg=#1e242a,fg=#2d3339] ||"


##### WINDOWS #####


# Inactive window
set -g window-status-style "bg=#1e242a,fg=#565c62"
set -g window-status-format "  #[fg=#565c62]#I #[fg=#474d53]#W  "

set -g window-status-current-style "bg=#292f35,fg=#bebebe"
set -g window-status-format "    #[fg=#565c62]#I #[fg=#474d53]#W  "
set -g window-status-current-format "   #[fg=#8aac8b,bold]#I #[fg=#bebebe]#W   "
# Window with activity
set -g window-status-activity-style "bg=#1e242a,fg=#aca98a"

# Bell
set -g window-status-bell-style "bg=#1e242a,fg=#ac8a8c,bold"

##### PANE BORDER #####
set -g pane-border-style "fg=#2d3339"
set -g pane-active-border-style "fg=#7797b7"

##### MESSAGE / COMMAND PROMPT #####

set -g message-style "bg=#242a30,fg=#bebebe"
set -g message-command-style "bg=#242a30,fg=#8aac8b"

##### MODE INDICATOR (copy-mode etc) #####

set -g mode-style "bg=#8aac8b,fg=#1a2026,bold"

# ressurect file
run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
